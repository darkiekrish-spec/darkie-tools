[build]
  base = "frontend"
  publish = "."
  # Netlify runs the build command from the base dir (frontend), so call the
  # repo-level script via "..". The script writes ./runtime-config.js in that
  # base directory.
  command = "sh ../scripts/netlify-build.sh"

[context.production]
  command = "sh ../scripts/netlify-build.sh"
